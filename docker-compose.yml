services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: makor
      POSTGRES_PASSWORD: makor
      POSTGRES_DB: portfolio_contest
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makor -d portfolio_contest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
